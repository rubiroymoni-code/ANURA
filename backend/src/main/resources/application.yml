spring:
  application:
    name: anura-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/anura}
    username: ${SPRING_DATASOURCE_USERNAME:anura}
    password: ${SPRING_DATASOURCE_PASSWORD:anura-local}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  jwt:
    secret: ${JWT_SECRET:local-development-secret-change-me-123456}
    expiration-hours: 168
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  imports:
    max-file-size: ${IMPORT_MAX_FILE_SIZE:1048576}
    max-rows: ${IMPORT_MAX_ROWS:2000}
    job-ttl-hours: ${IMPORT_JOB_TTL_HOURS:24}
  workout:
    max-active-sessions: ${WORKOUT_MAX_ACTIVE_SESSIONS:1}
    completed-edit-window-minutes: ${WORKOUT_COMPLETED_EDIT_WINDOW_MINUTES:15}
    sync-max-operations: ${WORKOUT_SYNC_MAX_OPERATIONS:100}
    offline-operation-retention-days: ${WORKOUT_OFFLINE_OPERATION_RETENTION_DAYS:30}
    estimated-1rm-max-reps: ${WORKOUT_ESTIMATED_1RM_MAX_REPS:12}
  progress:
    photo-storage-enabled: ${PROGRESS_PHOTO_STORAGE_ENABLED:false}
  mail:
    enabled: ${RESEND_ENABLED:false}
    api-key: ${RESEND_API_KEY:}
    from: ${RESEND_FROM:onboarding@resend.dev}
    frontend-url: ${APP_FRONTEND_URL:http://localhost:5173}
