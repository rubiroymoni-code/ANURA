services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-anura}
      POSTGRES_USER: ${POSTGRES_USER:-anura}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-anura-local}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-anura}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-anura}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-anura}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-anura-local}
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-me-123456}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:5173}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres-data:
